name: Reporter

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reporter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest, mypy and ruff
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --group test --locked

      - name: Lint
        run: uv run --no-sync ruff check files tests

      - name: Check formatting
        run: uv run --no-sync ruff format --check files tests

      - name: Type check
        run: uv run --no-sync mypy

      - name: Test the reporter
        run: uv run --no-sync pytest
