name: Test Playbook

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-playbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: tests/test.yml syntax check
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0

      - name: Install Ansible dependencies
        run: uv sync --group ansible --locked

      - name: Run Ansible syntax check
        run: |
          mkdir -p /tmp/ansible-roles
          ln -s "$GITHUB_WORKSPACE" /tmp/ansible-roles/archivematica_fpr
          ANSIBLE_ROLES_PATH=/tmp/ansible-roles uv run --no-sync ansible-playbook --syntax-check tests/test.yml
